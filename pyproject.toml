[project]
name = "locogen"
version = "0.1.0"
description = "LocoGen — locality-controlled guidance for masked discrete diffusion of regulatory DNA."
authors = [
    {name = "Dabin Jeong"},
]
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["scipy (>=1.16.3,<2.0.0)",
                "torch==2.3.1",
                "pandas (>=2.3.3,<3.0.0)",
                "wandb (>=0.23.1,<0.24.0)",
                "ml-collections (>=1.1.0,<2.0.0)",
                "tqdm (>=4.67.1,<5.0.0)",
                "selene-sdk (>=0.6.0,<0.7.0)",
                "setuptools (>=80.9.0,<81.0.0)",
                "pytorch-lightning (>=2.6.0,<3.0.0)",
                "hydra-core (>=1.3.2,<2.0.0)",
                "lightning (>=2.6.1,<3.0.0)",
                "timm (>=1.0.26,<2.0.0)",
                "grelu (>=1.1.0,<2.0.0)",
                "pyjaspar (>=4.0.0,<5.0.0)",
                "biopython (>=1.85,<2.0.0)",
                "huggingface-hub (>=0.34,<2.0.0)"]
